name: CI — MS-02 Publicaciones

on:
  push:
    branches:
      - 'feature/*'
      - 'Backend_MS02'
  pull_request:
    branches:
      - 'Backend_MS02'

jobs:
  # ──────────────────────────────────────────────────────
  # Job 1: Pruebas unitarias — corre en TODOS los triggers
  # ──────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ms02
          path: coverage/

  # ──────────────────────────────────────────────────────
  # Job 2: Lint + Build — solo en PR o push a Backend_MS02
  # ──────────────────────────────────────────────────────
  full-ci:
    name: Lint & Build Check
    needs: unit-tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/Backend_MS02'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  # ──────────────────────────────────────────────────────
  # Job 3: CD Placeholder — solo en push a Backend_MS02
  # ──────────────────────────────────────────────────────
  deploy:
    name: CD Placeholder
    needs: full-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/Backend_MS02'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy placeholder
        run: echo "CD no configurado aun — pendiente de despliegue en produccion"
