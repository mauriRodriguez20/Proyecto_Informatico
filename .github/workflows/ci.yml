name: CI — MS-04 InteraccionesyReputacion

on:
  push:
    branches:
      - 'feature/ms04-**'
      - 'Backend_MS04'
  pull_request:
    branches:
      - 'Backend_MS04'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ms04
          path: coverage/

  full-ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/Backend_MS04'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: full-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/Backend_MS04'

    steps:
      - name: Deploy placeholder
        run: echo "Deploy MS-04 pendiente de configuracion"
